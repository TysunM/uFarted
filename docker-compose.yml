# Pick how the app reaches the internet with COMPOSE_PROFILES in .env:
#   tunnel — Cloudflare Tunnel: free HTTPS, no open ports. Runs anywhere, including your laptop.
#   caddy  — Caddy on ports 80/443 with automatic Let's Encrypt. For a server with a public IP.
services:
  app:
    build: .
    image: ufarted:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
    volumes:
      - ufarted-data:/data
    expose: ["3000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  tunnel:
    image: cloudflare/cloudflared:2026.9.2
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on: [app]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  ufarted-data:
  caddy-data:
  caddy-config:
